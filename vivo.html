<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Esfera viva</title>
<style>
body{font-family:sans-serif;background:#111;color:#eee;margin:0;padding:16px}
#palco{position:relative;width:100%;height:50vh;background:#000;border-radius:8px;overflow:hidden;display:flex;align-items:center;justify-content:center;perspective:800px;touch-action:none}
#esfera{position:absolute;width:55%;max-width:300px;pointer-events:none;transition:all .7s ease}
#esfera.some{opacity:0;transform:scale(.3);filter:blur(14px)}
#personagem{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
#aparece{opacity:0;transform:scale(.2);filter:blur(14px);transition:all .8s ease}
#aparece.on{opacity:1;transform:scale(1);filter:blur(0)}
#flut{position:relative;animation:bob 2.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-14px)}}
#corpo{display:block;width:100%;height:100%;border-radius:22%;box-shadow:0 0 0 5px #111,0 0 28px 6px rgba(80,255,120,.55)}
#rosto{position:absolute;inset:0;width:100%;height:100%}
.olho{transform-box:fill-box;transform-origin:center}
#cam{position:fixed;left:0;top:0;width:2px;height:2px;opacity:0;pointer-events:none}
select,button,input{width:100%;box-sizing:border-box;padding:12px;margin:6px 0;font-size:16px;border-radius:8px;border:0;background:#2a7de1;color:#fff;font-weight:bold}
select,input{background:#222;border:1px solid #444;font-weight:normal}
#bVoz{background:#16803c}
#bOuvir{background:#8a2be2}
#bOuvir.on{background:#c0392b}
#info{font-size:18px;min-height:26px;margin:8px 0 0}
#fala{font-size:20px;min-height:28px;color:#7dff9a;margin:4px 0}
#ouvi{font-size:17px;min-height:24px;color:#9ec9ff;margin:4px 0}
.row{display:flex;gap:8px}
.row button{width:auto}
</style>
</head>
<body>
<h2>Esfera viva</h2>
<div id="palco">
  <img id="esfera"
