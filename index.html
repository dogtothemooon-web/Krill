<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Segundos</title>
<style>
html{height:100%}
body{font-family:sans-serif;margin:0;padding:16px;background:#111;color:#eee;box-sizing:border-box;height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden}
input,button{width:100%;box-sizing:border-box;padding:12px;margin:6px 0;font-size:16px;border-radius:8px;border:1px solid #444;background:#222;color:#eee}
button{background:#2a7de1;border:0;font-weight:bold}
button:disabled{opacity:.5}
button.red{background:#d33}
button.gray{background:#444}
#logo{display:block;flex-shrink:0;width:calc(100% + 32px);margin:-16px -16px 10px -16px;aspect-ratio:3/1;object-fit:cover;object-position:center 68%}
#setup{flex-shrink:0}
#status{flex-shrink:0;font-size:17px;margin:6px 0;min-height:22px}
#messages{flex:1;min-height:80px;overflow-y:auto;background:#1b1b1b;border:1px solid #444;border-radius:8px;padding:10px;margin:6px 0}
.msg{padding:9px;margin:6px 0;border-radius:8px;background:#303030;overflow-wrap:anywhere}
.mine{background:#174b75;text-align:right}
.msg img,.msg video{max-width:100%;max-height:260px;border-radius:6px;display:block;margin:4px 0}
.row{display:flex;gap:8px;flex-shrink:0;padding-bottom:env(safe-area-inset-bottom,0px)}
.cam{display:flex;gap:8px;flex-shrink:0}
.cam button{margin:2px 0;padding:10px;font-size:15px}
#preview{display:none;flex-shrink:0;width:100%;max-height:150px;background:#000;border-radius:8px;object-fit:contain;margin:4px 0}
</style>
</head>
<body>

<img id="logo" src="segundos.jpg" alt="Segundos">

<div id="setup">
  <input id="token" type="password" placeholder="Token do bot (do @BotFather)" autocomplete="off" autocapitalize="off">
  <input id="chat" placeholder="Chat ID" inputmode="numeric">
  <button id="connect">Conectar</button>
</div>

<div id="status"></div>

<video id="preview" muted playsinline autoplay></video>
<div class="cam">
  <button id="camBtn" class="gray" disabled>📷 Câmera</button>
  <button id="recBtn" disabled>⏺ Gravar</button>
  <button id="liveBtn" disabled>🔴 Ao vivo</button>
</div>

<div id="messages"></div>

<div class="row">
  <input id="messageText" placeholder="Digite sua mensagem..." disabled>
  <button id="sendMessage" style="width:auto" disabled>Enviar</button>
</div>

<script>
const $ = id => document.getElementById(id);

let TOKEN = "", chat = "";
let polling = false, pollTimer = null;
let enviadas = [];
let todas = [];
let fileUrls = {};
let ultimaAssinatura = "";
let ultimoDigitando = 0;
const agendadas = new Set();
const apagadas = new Set();
const INICIO = Math.floor(Date.now() / 1000) - 5;

/* tempo até apagar: sorteado entre 10 e 15 segundos */
const TEMPO_MIN = 10000;
const TEMPO_MAX = 15000;
/* duração de cada trecho no modo "ao vivo" */
const TRECHO_MS = 5000;

/* câmera */
let stream = null;
let gravando = false;
let aoVivo = false;
let recorderAtual = null;

function loadCfg() {
  try {
    const c = JSON.parse(localStorage.getItem("alarme_cfg2") || "{}");
    $("token").value = c.token || "";
    $("chat").value = c.chat || "";
  } catch(e) {}
}
function readCfg() {
  TOKEN = $("token").value.trim().replace(/^bot/i, "");
  chat = $("chat").value.trim();
  if (!TOKEN || !chat) {
    $("status").innerText = "Preencha o token do bot e o Chat ID.";
    return false;
  }
  try {
    localStorage.setItem("alarme_cfg2", JSON.stringify({token: TOKEN, chat}));
  } catch(e) {}
  return true;
}

async function tg(metodo, opcoes = {}) {
  const r = await fetch("https://api.telegram.org/bot" + TOKEN + "/" + metodo, opcoes);
  let d = {};
  try { d = await r.json(); } catch(e) {}
  if (!d.ok) throw new Error(d.description || "Erro na comunicação (" + r.status + ")");
  return d;
}

/* ---------- "digitando..." no Telegram ---------- */
async function avisarDigitando() {
  if (!TOKEN || $("messageText").disabled) return;
  if (!$("messageText").value.trim()) return;
  if (Date.now() - ultimoDigitando < 4000) return;
  ultimoDigitando = Date.now();
  try {
    await tg("sendChatAction", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({chat_id: chat, action: "typing"})
    });
  } catch(e) {}
}

/* ---------- apagar automático ---------- */
function agendar(id, dataMs) {
  if (!id || agendadas.has(id)) return;
  agendadas.add(id);
  const tempo = TEMPO_MIN + Math.random() * (TEMPO_MAX - TEMPO_MIN);
  const espera = Math.max(0, dataMs + tempo - Date.now());
  setTimeout(() => apagar(id), espera);
}

async function apagar(id) {
  apagadas.add(id);
  render();
  try {
    await tg("deleteMessage", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({chat_id: chat, message_id: id})
    });
  } catch(e) {}
}

/* ---------- conexão ---------- */
async function conectar() {
  try {
    const d = await tg("getMe");
    $("status").innerText = "Conectado como @" + d.result.username;
  } catch(e) {
    $("status").innerText = "Token inválido ou sem internet: " + e.message;
    return false;
  }
  $("messageText").disabled = false;
  $("sendMessage").disabled = false;
  $("camBtn").disabled = false;
  carregarMensagens();
  clearInterval(pollTimer);
  pollTimer = setInterval(carregarMensagens, 3000);
  return true;
}

/* ---------- enviar texto ---------- */
async function enviarMensagem() {
  const input = $("messageText");
  const text = input.value.trim();
  if (!text) return;
  try {
    $("sendMessage").disabled = true;
    const d = await tg("sendMessage", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({chat_id: chat, text})
    });
    const id = d.result.message_id;
    enviadas.push({id, date: Math.floor(Date.now()/1000), text, mine: true});
    agendar(id, Date.now());
    input.value = "";
    ultimoDigitando = 0;
    $("status").innerText = "Mensagem enviada.";
    carregarMensagens();
  } catch(e) {
    $("status").innerText = "Erro: " + e.message;
  } finally {
    $("sendMessage").disabled = false;
  }
}

/* ---------- câmera (vídeo sem som) ---------- */
async function ligarCamera() {
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: {facingMode: "environment", width: {ideal: 640}, height: {ideal: 480}},
      audio: false
    });
  } catch(e) {
    $("status").innerText = "Não consegui abrir a câmera: " + e.message;
    return;
  }
  const v = $("preview");
  v.srcObject = stream;
  v.style.display = "block";
  $("camBtn").innerText = "✖ Fechar câmera";
  $("recBtn").disabled = false;
  $("liveBtn").disabled = false;
  $("status").innerText = "Câmera ligada (sem som).";
}

function desligarCamera() {
  aoVivo = false;
  if (recorderAtual && recorderAtual.state !== "inactive") recorderAtual.stop();
  if (stream) stream.getTracks().forEach(t => t.stop());
  stream = null;
  $("preview").srcObject = null;
  $("preview").style.display = "none";
  $("camBtn").innerText = "📷 Câmera";
  $("recBtn").disabled = true;
  $("liveBtn").disabled = true;
  atualizarBotoes();
}

function escolherFormato() {
  const opcoes = ["video/mp4", "video/webm;codecs=vp9", "video/webm;codecs=vp8", "video/webm"];
  for (const t of opcoes) {
    if (window.MediaRecorder && MediaRecorder.isTypeSupported(t)) return t;
  }
  return "";
}

/* grava um trecho; se ms for informado, para sozinho */
function gravarTrecho(ms) {
  return new Promise(resolve => {
    const mime = escolherFormato();
    const pedacos = [];
    let rec;
    try { rec = new MediaRecorder(stream, mime ? {mimeType: mime} : {}); }
    catch(e) { $("status").innerText = "Gravação não suportada: " + e.message; return resolve(null); }
    recorderAtual = rec;
    rec.ondataavailable = e => { if (e.data && e.data.size) pedacos.push(e.data); };
    rec.onstop = () => resolve(new Blob(pedacos, {type: rec.mimeType || mime || "video/webm"}));
    rec.start();
    if (ms) setTimeout(() => { if (rec.state !== "inactive") rec.stop(); }, ms);
  });
}

async function enviarVideo(blob) {
  if (!blob || blob.size < 1000) return;
  const mp4 = blob.type.includes("mp4");
  const fd = new FormData();
  fd.append("chat_id", chat);
  fd.append("supports_streaming", "true");
  fd.append("video", blob, mp4 ? "video.mp4" : "video.webm");
  try {
    const d = await tg("sendVideo", {method: "POST", body: fd});
    const id = d.result.message_id;
    enviadas.push({id, date: Math.floor(Date.now()/1000), text: "", mine: true, kind: "video", url: URL.createObjectURL(blob)});
    agendar(id, Date.now());
    $("status").innerText = "Vídeo enviado.";
    carregarMensagens();
  } catch(e) {
    $("status").innerText = "Erro ao enviar vídeo: " + e.message;
  }
}

function atualizarBotoes() {
  $("recBtn").innerText = gravando ? "⏹ Parar e enviar" : "⏺ Gravar";
  $("recBtn").className = gravando ? "red" : "";
  $("liveBtn").innerText = aoVivo ? "⏹ Parar ao vivo" : "🔴 Ao vivo";
  $("liveBtn").className = aoVivo ? "red" : "";
  $("recBtn").disabled = !stream || aoVivo;
  $("liveBtn").disabled = !stream || gravando;
}

async function alternarGravacao() {
  if (!stream) return;
  if (gravando) {
    gravando = false;
    atualizarBotoes();
    if (recorderAtual && recorderAtual.state !== "inactive") recorderAtual.stop();
    return;
  }
  gravando = true;
  atualizarBotoes();
  $("status").innerText = "Gravando...";
  const blob = await gravarTrecho(0);
  gravando = false;
  atualizarBotoes();
  await enviarVideo(blob);
}

/* "ao vivo": grava e envia trechos seguidos de 5 s */
async function alternarAoVivo() {
  if (!stream) return;
  if (aoVivo) {
    aoVivo = false;
    atualizarBotoes();
    if (recorderAtual && recorderAtual.state !== "inactive") recorderAtual.stop();
    return;
  }
  aoVivo = true;
  atualizarBotoes();
  $("status").innerText = "Ao vivo: enviando trechos de " + (TRECHO_MS/1000) + " s...";
  while (aoVivo && stream) {
    const blob = await gravarTrecho(TRECHO_MS);
    enviarVideo(blob);
  }
  aoVivo = false;
  atualizarBotoes();
  $("status").innerText = "Ao vivo encerrado.";
}

/* ---------- receber foto / vídeo ---------- */
async function resolverArquivo(fileId) {
  if (fileUrls[fileId]) return fileUrls[fileId];
  const d = await tg("getFile?file_id=" + encodeURIComponent(fileId));
  const url = "https://api.telegram.org/file/bot" + TOKEN + "/" + d.result.file_path;
  fileUrls[fileId] = url;
  return url;
}

/* ---------- mostrar ---------- */
function render() {
  const lista = todas.filter(m => !apagadas.has(m.id));
  const assinatura = lista.map(m => m.id + "|" + m.text + "|" + (m.url || "")).join("§");
  if (assinatura === ultimaAssinatura) return;
  ultimaAssinatura = assinatura;

  const box = $("messages");
  const noFim = box.scrollHeight - box.scrollTop - box.clientHeight < 40;
  box.innerHTML = "";
  lista.forEach(m => {
    const div = document.createElement("div");
    div.className = "msg" + (m.mine ? " mine" : "");
    const hora = new Date(m.date * 1000).toLocaleTimeString("pt-BR", {hour:"2-digit", minute:"2-digit"});
    const topo = document.createElement("div");
    topo.textContent = hora + (m.text ? " — " + m.text : "");
    div.appendChild(topo);
    if (m.url && m.kind === "video") {
      const vid = document.createElement("video");
      vid.src = m.url;
      vid.muted = true;
      vid.autoplay = true;
      vid.loop = true;
      vid.playsInline = true;
      vid.controls = true;
      div.appendChild(vid);
    } else if (m.url) {
      const img = document.createElement("img");
      img.src = m.url;
      img.onclick = () => window.open(m.url, "_blank");
      div.appendChild(img);
    }
    box.appendChild(div);
  });
  if (noFim) box.scrollTop = box.scrollHeight;
}

async function carregarMensagens() {
  if (polling) return;
  polling = true;
  try {
    const d = await tg("getUpdates?limit=100");
    const msgs = d.result
      .map(u => u.message)
      .filter(m => m && (m.text || m.photo || m.video || m.video_note || m.animation) && String(m.chat.id) === chat && m.date >= INICIO && !apagadas.has(m.message_id));

    const recebidas = [];
    for (const m of msgs) {
      const item = {id: m.message_id, date: m.date, text: m.text || m.caption || "", mine: false};
      try {
        if (m.photo) {
          item.url = await resolverArquivo(m.photo[m.photo.length - 1].file_id);
        } else if (m.video || m.video_note || m.animation) {
          const v = m.video || m.video_note || m.animation;
          item.url = await resolverArquivo(v.file_id);
          item.kind = "video";
        }
      } catch(e) { item.text += " [arquivo indisponível]"; }
      recebidas.push(item);
      agendar(item.id, m.date * 1000);
    }

    todas = recebidas.concat(enviadas).sort((a, b) => a.date - b.date).slice(-40);
    render();
  } catch(e) {
    $("status").innerText = "Erro nas mensagens: " + e.message;
  } finally {
    polling = false;
  }
}

$("connect").onclick = () => { if (readCfg()) conectar(); };
$("sendMessage").onclick = enviarMensagem;
$("camBtn").onclick = () => stream ? desligarCamera() : ligarCamera();
$("recBtn").onclick = alternarGravacao;
$("liveBtn").onclick = alternarAoVivo;
$("messageText").addEventListener("input", avisarDigitando);
$("messageText").addEventListener("keydown", e => { if (e.key === "Enter") enviarMensagem(); });

loadCfg();
</script>
</body>
</html>
