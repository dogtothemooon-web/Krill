<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chat Telegram</title>
<style>
body{font-family:sans-serif;margin:0;padding:16px;background:#111;color:#eee}
input,button{width:100%;box-sizing:border-box;padding:12px;margin:6px 0;font-size:16px;border-radius:8px;border:1px solid #444;background:#222;color:#eee}
button{background:#2a7de1;border:0;font-weight:bold}
button:disabled{opacity:.5}
#status{font-size:17px;margin:10px 0;min-height:22px}
#messages{height:50vh;overflow-y:auto;background:#1b1b1b;border:1px solid #444;border-radius:8px;padding:10px;margin:10px 0}
.msg{padding:9px;margin:6px 0;border-radius:8px;background:#303030;overflow-wrap:anywhere}
.mine{background:#174b75;text-align:right}
.msg img{max-width:100%;max-height:260px;border-radius:6px;display:block;margin:4px 0}
.mine img{margin-left:auto}
.row{display:flex;gap:8px}
#photoBtn{width:auto;background:#444}
</style>
</head>
<body>

<h2>Chat Telegram</h2>

<div id="setup">
  <input id="token" type="password" placeholder="Token do bot (do @BotFather)" autocomplete="off" autocapitalize="off">
  <input id="chat" placeholder="Chat ID" inputmode="numeric">
  <button id="connect">Conectar</button>
</div>

<div id="status"></div>

<div id="messages"></div>

<div class="row">
  <button id="photoBtn" disabled>📷</button>
  <input id="messageText" placeholder="Digite sua mensagem..." disabled>
  <button id="sendMessage" style="width:auto" disabled>Enviar</button>
</div>
<input id="photoInput" type="file" accept="image/*" style="display:none">

<script>
const $ = id => document.getElementById(id);

let TOKEN = "", chat = "";
let polling = false, pollTimer = null;
let enviadas = [];
let fileUrls = {};
let ultimaAssinatura = "";
const INICIO = Math.floor(Date.now() / 1000) - 5;

function loadCfg() {
  try {
    const c = JSON.parse(localStorage.getItem("alarme_cfg2") || "{}");
    $("token").value = c.token || "";
    $("chat").value = c.chat || "";
  } catch(e) {}
}
function readCfg() {
  TOKEN = $("token").value.trim().replace(/^bot/i, "");
  chat = $("chat").value.trim();
  if (!TOKEN || !chat) {
    $("status").innerText = "Preencha o token do bot e o Chat ID.";
    return false;
  }
  try {
    localStorage.setItem("alarme_cfg2", JSON.stringify({token: TOKEN, chat}));
  } catch(e) {}
  return true;
}

async function tg(metodo, opcoes = {}) {
  const r = await fetch("https://api.telegram.org/bot" + TOKEN + "/" + metodo, opcoes);
  let d = {};
  try { d = await r.json(); } catch(e) {}
  if (!d.ok) throw new Error(d.description || "Erro na comunicação (" + r.status + ")");
  return d;
}

async function conectar() {
  try {
    const d = await tg("getMe");
    $("status").innerText = "Conectado como @" + d.result.username;
  } catch(e) {
    $("status").innerText = "Token inválido ou sem internet: " + e.message;
    return false;
  }
  $("messageText").disabled = false;
  $("sendMessage").disabled = false;
  $("photoBtn").disabled = false;
  carregarMensagens();
  clearInterval(pollTimer);
  pollTimer = setInterval(carregarMensagens, 3000);
  return true;
}

async function enviarMensagem() {
  const input = $("messageText");
  const text = input.value.trim();
  if (!text) return;
  try {
    $("sendMessage").disabled = true;
    await tg("sendMessage", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({chat_id: chat, text})
    });
    enviadas.push({date: Math.floor(Date.now()/1000), text, mine: true});
    input.value = "";
    $("status").innerText = "Mensagem enviada ao Telegram.";
    carregarMensagens();
  } catch(e) {
    $("status").innerText = "Erro: " + e.message;
  } finally {
    $("sendMessage").disabled = false;
  }
}

/* ---------- enviar foto ---------- */
async function enviarFoto(arquivo) {
  if (!arquivo) return;
  const legenda = $("messageText").value.trim();
  try {
    $("photoBtn").disabled = true;
    $("status").innerText = "Enviando foto...";
    const form = new FormData();
    form.append("chat_id", chat);
    form.append("photo", arquivo, arquivo.name || "foto.jpg");
    if (legenda) form.append("caption", legenda);
    await tg("sendPhoto", {method: "POST", body: form});
    enviadas.push({
      date: Math.floor(Date.now()/1000),
      text: legenda,
      mine: true,
      localUrl: URL.createObjectURL(arquivo)
    });
    $("messageText").value = "";
    $("status").innerText = "Foto enviada ao Telegram.";
    carregarMensagens();
  } catch(e) {
    $("status").innerText = "Erro ao enviar foto: " + e.message;
  } finally {
    $("photoBtn").disabled = false;
    $("photoInput").value = "";
  }
}

/* ---------- receber foto ---------- */
async function resolverFoto(fileId) {
  if (fileUrls[fileId]) return fileUrls[fileId];
  const d = await tg("getFile?file_id=" + encodeURIComponent(fileId));
  const url = "https://api.telegram.org/file/bot" + TOKEN + "/" + d.result.file_path;
  fileUrls[fileId] = url;
  return url;
}

/* ---------- mostrar ---------- */
function mostrarMensagens(lista) {
  const assinatura = lista.map(m => m.date + "|" + m.text + "|" + (m.url || "")).join("§");
  if (assinatura === ultimaAssinatura) return;
  ultimaAssinatura = assinatura;

  const box = $("messages");
  const noFim = box.scrollHeight - box.scrollTop - box.clientHeight < 40;
  box.innerHTML = "";
  lista.forEach(m => {
    const div = document.createElement("div");
    div.className = "msg" + (m.mine ? " mine" : "");
    const hora = new Date(m.date * 1000).toLocaleTimeString("pt-BR", {hour:"2-digit", minute:"2-digit"});
    const topo = document.createElement("div");
    topo.textContent = hora + (m.text ? " — " + m.text : "");
    div.appendChild(topo);
    if (m.url) {
      const img = document.createElement("img");
      img.src = m.url;
      img.onclick = () => window.open(m.url, "_blank");
      div.appendChild(img);
    }
    box.appendChild(div);
  });
  if (noFim) box.scrollTop = box.scrollHeight;
}

async function carregarMensagens() {
  if (polling) return;
  polling = true;
  try {
    const d = await tg("getUpdates?limit=100");
    const msgs = d.result
      .map(u => u.message)
      .filter(m => m && (m.text || m.photo) && String(m.chat.id) === chat && m.date >= INICIO);

    const recebidas = [];
    for (const m of msgs) {
      const item = {date: m.date, text: m.text || m.caption || "", mine: false};
      if (m.photo) {
        const maior = m.photo[m.photo.length - 1];
        try { item.url = await resolverFoto(maior.file_id); }
        catch(e) { item.text += " [foto indisponível]"; }
      }
      recebidas.push(item);
    }

    const minhas = enviadas.map(e => ({date: e.date, text: e.text, mine: true, url: e.localUrl}));
    const tudo = recebidas.concat(minhas).sort((a, b) => a.date - b.date).slice(-40);
    mostrarMensagens(tudo);
  } catch(e) {
    $("status").innerText = "Erro nas mensagens: " + e.message;
  } finally {
    polling = false;
  }
}

$("connect").onclick = () => { if (readCfg()) conectar(); };
$("sendMessage").onclick = enviarMensagem;
$("photoBtn").onclick = () => $("photoInput").click();
$("photoInput").onchange = e => enviarFoto(e.target.files[0]);
$("messageText").addEventListener("keydown", e => { if (e.key === "Enter") enviarMensagem(); });

loadCfg();
</script>
</body>
</html>
