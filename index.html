<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Segundos</title>
<style>
html{height:auto}
body{font-family:sans-serif;margin:0;padding:16px;background:#111;color:#eee;box-sizing:border-box;min-height:100dvh}
body::after{content:"";display:block;height:48px}
#app{display:flex;flex-direction:column;height:calc(100vh - 32px);height:calc(100dvh - 32px)}
input,button{width:100%;box-sizing:border-box;padding:12px;margin:6px 0;font-size:16px;border-radius:8px;border:1px solid #444;background:#222;color:#eee}
button{background:#2a7de1;border:0;font-weight:bold}
button:disabled{opacity:.5}
#logo{display:block;flex-shrink:0;width:calc(100% + 32px);margin:-16px -16px 10px -16px;aspect-ratio:3/1;object-fit:cover;object-position:center 68%}
#setup{flex-shrink:0}
#status{flex-shrink:0;font-size:17px;margin:6px 0;min-height:22px}
#messages{flex:1;min-height:80px;overflow-y:auto;overscroll-behavior:contain;background:#1b1b1b;border:1px solid #444;border-radius:8px;padding:10px;margin:6px 0}
.msg{padding:9px;margin:6px 0;border-radius:8px;background:#303030;overflow-wrap:anywhere}
.mine{background:#174b75;text-align:right}
.msg img{max-width:100%;max-height:260px;border-radius:6px;display:block;margin:4px 0}
.row{display:flex;gap:8px;flex-shrink:0;padding-bottom:env(safe-area-inset-bottom,0px)}
#emojiBtn{width:auto;background:#333;border:1px solid #444;font-size:20px;padding:8px 12px}
#emojiPanel{display:none;flex-shrink:0;height:170px;overflow-y:auto;overscroll-behavior:contain;background:#1b1b1b;border:1px solid #444;border-radius:8px;padding:6px;margin:6px 0;flex-wrap:wrap;gap:2px;align-content:flex-start}
#emojiPanel.aberto{display:flex}
#emojiPanel button{width:12.5%;background:none;border:0;margin:0;padding:6px 0;font-size:24px;line-height:1.2}
</style>
</head>
<body>

<div id="app">

<img id="logo" src="segundos.jpg" alt="Segundos">

<div id="setup">
  <input id="token" type="password" placeholder="Token do bot (do @BotFather)" autocomplete="off" autocapitalize="off">
  <input id="chat" placeholder="Chat ID" inputmode="numeric" autocomplete="off">
  <button id="connect" type="button">Conectar</button>
</div>

<div id="status"></div>

<div id="messages"></div>

<div id="emojiPanel"></div>

<div class="row">
  <button id="emojiBtn" type="button" disabled>😀</button>
  <input id="messageText" placeholder="Digite sua mensagem..." disabled>
  <button id="sendMessage" type="button" style="width:auto" disabled>Enviar</button>
</div>

</div>

<script>
const $ = id => document.getElementById(id);

/* mostra qualquer erro da página na tela */
window.onerror = (msg) => { $("status").innerText = "Erro na página: " + msg; };
window.addEventListener("unhandledrejection", ev => {
  $("status").innerText = "Erro: " + (ev.reason && ev.reason.message ? ev.reason.message : ev.reason);
});

let TOKEN = "", chat = "";
let polling = false, pollTimer = null;
let enviadas = [];
let todas = [];
let fileUrls = {};
let ultimaAssinatura = "";
let ultimoDigitando = 0;
const agendadas = new Set();
const apagadas = new Set();
const INICIO = Math.floor(Date.now() / 1000) - 5;

/* tempo até apagar: sorteado entre 10 e 15 segundos */
const TEMPO_MIN = 10000;
const TEMPO_MAX = 15000;

/* ---------- emojis ---------- */
const EMOJIS = ("😀 😃 😄 😁 😆 😅 😂 🤣 😊 😇 🙂 🙃 😉 😍 🥰 😘 😗 😋 😛 😜 🤪 😎 🤩 🥳 🤗 🤔 🤭 🤫 😐 😑 😶 🙄 😏 😬 😌 😔 😪 😴 😷 🤒 🤢 🤮 🥵 🥶 😵 🤯 😕 😟 🙁 😮 😲 😳 🥺 😢 😭 😱 😖 😞 😓 😩 😫 🥱 😤 😡 😠 🤬 😈 👿 💀 💩 🤡 👻 👽 🤖 " +
  "👍 👎 👌 ✌ 🤞 🤟 🤘 🤙 👈 👉 👆 👇 👋 🤚 ✋ 🖖 👏 🙌 🤝 🙏 💪 🫶 " +
  "❤ 🧡 💛 💚 💙 💜 🖤 🤍 💔 💕 💞 💓 💗 💖 💘 💝 " +
  "🔥 ✨ ⭐ 🌟 💫 💥 💯 ✅ ❌ ⚠ ❓ ❗ 🎉 🎊 🎁 🎂 🍕 🍔 🍟 🍺 🍻 ☕ " +
  "🐶 🐱 🐭 🐰 🦊 🐻 🐼 🐸 🐵 🐔 🦄 🌹 🌻 🌈 ☀ 🌙 ⚡ ❄ 🌊 " +
  "⚽ 🏀 🎮 🎵 🎶 📱 💻 🚗 ✈ 🏠 ⏰ 🔔 🔒 🔑 💰").split(" ");

function montarEmojis() {
  const painel = $("emojiPanel");
  EMOJIS.forEach(e => {
    const b = document.createElement("button");
    b.type = "button";
    b.textContent = e;
    b.addEventListener("mousedown", ev => ev.preventDefault());
    b.addEventListener("click", () => inserirEmoji(e));
    painel.appendChild(b);
  });
}

function inserirEmoji(e) {
  const input = $("messageText");
  if (input.disabled) return;
  const ini = input.selectionStart != null ? input.selectionStart : input.value.length;
  const fim = input.selectionEnd != null ? input.selectionEnd : input.value.length;
  input.value = input.value.slice(0, ini) + e + input.value.slice(fim);
  const pos = ini + e.length;
  try { input.setSelectionRange(pos, pos); } catch(err) {}
  input.focus();
  input.dispatchEvent(new Event("input"));
}

function alternarEmojis() {
  $("emojiPanel").classList.toggle("aberto");
}

function loadCfg() {
  try {
    const c = JSON.parse(localStorage.getItem("alarme_cfg2") || "{}");
    $("token").value = c.token || "";
    $("chat").value = c.chat || "";
  } catch(e) {}
}
function readCfg() {
  TOKEN = $("token").value.trim().replace(/^bot/i, "");
  chat = $("chat").value.trim();
  if (!TOKEN || !chat) {
    $("status").innerText = "Preencha o token do bot e o Chat ID.";
    return false;
  }
  try {
    localStorage.setItem("alarme_cfg2", JSON.stringify({token: TOKEN, chat}));
  } catch(e) {}
  return true;
}

async function tg(metodo, opcoes = {}) {
  const r = await fetch("https://api.telegram.org/bot" + TOKEN + "/" + metodo, opcoes);
  let d = {};
  try { d = await r.json(); } catch(e) {}
  if (!d.ok) throw new Error(d.description || "Erro na comunicação (" + r.status + ")");
  return d;
}

/* ---------- "digitando..." no Telegram ---------- */
async function avisarDigitando() {
  if (!TOKEN || $("messageText").disabled) return;
  if (!$("messageText").value.trim()) return;
  if (Date.now() - ultimoDigitando < 4000) return;
  ultimoDigitando = Date.now();
  try {
    await tg("sendChatAction", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({chat_id: chat, action: "typing"})
    });
  } catch(e) {}
}

/* ---------- apagar automático (site + Telegram ao mesmo tempo) ---------- */
function agendar(id, dataMs) {
  if (!id || agendadas.has(id)) return;
  agendadas.add(id);
  const tempo = TEMPO_MIN + Math.random() * (TEMPO_MAX - TEMPO_MIN);
  const espera = Math.max(0, dataMs + tempo - Date.now());
  setTimeout(() => apagar(id), espera);
}

async function apagar(id) {
  apagadas.add(id);
  render();
  for (let i = 0; i < 4; i++) {
    try {
      await tg("deleteMessage", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({chat_id: chat, message_id: id})
      });
      return;
    } catch(e) {
      if (/not found|can't be deleted/i.test(e.message)) return;
      await new Promise(r => setTimeout(r, 1500));
    }
  }
}

/* ---------- conexão ---------- */
async function conectar() {
  $("status").innerText = "Conectando...";
  $("connect").disabled = true;
  try {
    await tg("getMe");
  } catch(e) {
    $("status").innerText = "Não conectou: " + e.message;
    $("connect").disabled = false;
    return false;
  }
  $("connect").disabled = false;
  $("status").innerText = "";
  $("messageText").disabled = false;
  $("sendMessage").disabled = false;
  $("emojiBtn").disabled = false;
  carregarMensagens();
  clearInterval(pollTimer);
  pollTimer = setInterval(carregarMensagens, 3000);
  return true;
}

/* ---------- enviar texto ---------- */
async function enviarMensagem() {
  const input = $("messageText");
  const text = input.value.trim();
  if (!text) return;
  try {
    $("sendMessage").disabled = true;
    const d = await tg("sendMessage", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({chat_id: chat, text})
    });
    const id = d.result.message_id;
    enviadas.push({id, date: Math.floor(Date.now()/1000), text, mine: true});
    agendar(id, Date.now());
    input.value = "";
    ultimoDigitando = 0;
    $("status").innerText = "Mensagem enviada.";
    carregarMensagens();
  } catch(e) {
    $("status").innerText = "Erro: " + e.message;
  } finally {
    $("sendMessage").disabled = false;
  }
}

/* ---------- receber foto ---------- */
async function resolverFoto(fileId) {
  if (fileUrls[fileId]) return fileUrls[fileId];
  const d = await tg("getFile?file_id=" + encodeURIComponent(fileId));
  const url = "https://api.telegram.org/file/bot" + TOKEN + "/" + d.result.file_path;
  fileUrls[fileId] = url;
  return url;
}

/* ---------- mostrar ---------- */
function render() {
  const lista = todas.filter(m => !apagadas.has(m.id));
  const assinatura = lista.map(m => m.id + "|" + m.text + "|" + (m.url || "")).join("§");
  if (assinatura === ultimaAssinatura) return;
  ultimaAssinatura = assinatura;

  const box = $("messages");
  const noFim = box.scrollHeight - box.scrollTop - box.clientHeight < 40;
  box.innerHTML = "";
  lista.forEach(m => {
    const div = document.createElement("div");
    div.className = "msg" + (m.mine ? " mine" : "");
    const hora = new Date(m.date * 1000).toLocaleTimeString("pt-BR", {hour:"2-digit", minute:"2-digit"});
    const topo = document.createElement("div");
    topo.textContent = hora + (m.text ? " — " + m.text : "");
    div.appendChild(topo);
    if (m.url) {
      const img = document.createElement("img");
      img.src = m.url;
      img.onclick = () => window.open(m.url, "_blank");
      div.appendChild(img);
    }
    box.appendChild(div);
  });
  if (noFim) box.scrollTop = box.scrollHeight;
}

async function carregarMensagens() {
  if (polling) return;
  polling = true;
  try {
    const d = await tg("getUpdates?limit=100&offset=-100");
    const todasDoChat = d.result
      .map(u => u.message)
      .filter(m => m && String(m.chat.id) === chat && !apagadas.has(m.message_id));

    todasDoChat.forEach(m => agendar(m.message_id, m.date * 1000));

    const recebidas = [];
    for (const m of todasDoChat) {
      if (!(m.text || m.photo) || m.date < INICIO) continue;
      const item = {id: m.message_id, date: m.date, text: m.text || m.caption || "", mine: false};
      if (m.photo) {
        const maior = m.photo[m.photo.length - 1];
        try { item.url = await resolverFoto(maior.file_id); }
        catch(e) { item.text += " [foto indisponível]"; }
      }
      recebidas.push(item);
    }

    todas = recebidas.concat(enviadas).sort((a, b) => a.date - b.date).slice(-40);
    render();
  } catch(e) {
    $("status").innerText = "Erro nas mensagens: " + e.message;
  } finally {
    polling = false;
  }
}

$("connect").addEventListener("click", () => { if (readCfg()) conectar(); });
$("sendMessage").addEventListener("click", enviarMensagem);
$("emojiBtn").addEventListener("click", alternarEmojis);
$("messageText").addEventListener("input", avisarDigitando);
$("messageText").addEventListener("keydown", e => { if (e.key === "Enter") enviarMensagem(); });

try { montarEmojis(); } catch(e) {}
loadCfg();
</script>
</body>
</html>
