<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Teste da esfera</title>
<style>
body{font-family:sans-serif;background:#111;color:#eee;margin:0;padding:16px}
#palco{display:flex;align-items:center;justify-content:center;width:100%;height:55vh;background:#000;border-radius:8px;overflow:hidden;touch-action:none}
#esfera{width:55%;max-width:300px;user-select:none;-webkit-user-drag:none;pointer-events:none}
.grade{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
button{padding:12px;font-size:16px;border-radius:8px;border:0;background:#2a7de1;color:#fff;font-weight:bold}
button.parar{background:#444;grid-column:span 2}

.flutuar{animation:flutuar 3s ease-in-out infinite}
@keyframes flutuar{50%{transform:translateY(-35px)}}

.girar{animation:girar 6s linear infinite}
@keyframes girar{to{transform:rotate(360deg)}}

.pulsar{animation:pulsar 1.2s ease-in-out infinite}
@keyframes pulsar{50%{transform:scale(1.2)}}

.tremer{animation:tremer .15s linear infinite}
@keyframes tremer{25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}

.quicar{animation:quicar 1s cubic-bezier(.3,0,.7,1) infinite}
@keyframes quicar{50%{transform:translateY(-90px)}}

.orbitar{animation:orbitar 4s linear infinite}
@keyframes orbitar{
  from{transform:rotate(0) translateX(70px) rotate(0)}
  to{transform:rotate(360deg) translateX(70px) rotate(-360deg)}
}

.seguir{transition:transform .15s ease-out}
</style>
</head>
<body>
<h2>Teste da esfera</h2>

<div id="palco"><img id="esfera" src="esfera.gif" alt="esfera"></div>

<div class="grade">
  <button onclick="mov('flutuar')">Flutuar</button>
  <button onclick="mov('girar')">Girar</button>
  <button onclick="mov('pulsar')">Pulsar</button>
  <button onclick="mov('tremer')">Tremer</button>
  <button onclick="mov('quicar')">Quicar</button>
  <button onclick="mov('orbitar')">Orbitar</button>
  <button onclick="mov('seguir')">Seguir o dedo</button>
  <button onclick="inclinar()">Inclinar o celular</button>
  <button class="parar" onclick="mov('')">Parar</button>
</div>
<p id="info"></p>

<script>
const $ = id => document.getElementById(id);
const esfera = $("esfera"), palco = $("palco");
let modo = "";

function mov(nome) {
  modo = nome === "seguir" ? "seguir" : "";
  esfera.className = nome;
  esfera.style.transform = "";
  $("info").innerText = nome === "seguir" ? "Arraste o dedo dentro da caixa preta." : "";
}

palco.addEventListener("pointermove", e => {
  if (modo !== "seguir") return;
  const r = palco.getBoundingClientRect();
  const x = e.clientX - r.left - r.width / 2;
  const y = e.clientY - r.top - r.height / 2;
  esfera.style.transform = "translate(" + x + "px," + y + "px)";
});

function inclinar() {
  mov("seguir");
  modo = "inclinar";
  $("info").innerText = "Incline o celular para mover a esfera.";
  const ativar = () => window.addEventListener("deviceorientation", e => {
    if (modo !== "inclinar") return;
    const x = Math.max(-120, Math.min(120, (e.gamma || 0) * 4));
    const y = Math.max(-120, Math.min(120, ((e.beta || 0) - 45) * 4));
    esfera.style.transform = "translate(" + x + "px," + y + "px)";
  });
  if (typeof DeviceOrientationEvent !== "undefined" && DeviceOrientationEvent.requestPermission) {
    DeviceOrientationEvent.requestPermission().then(ativar);
  } else {
    ativar();
  }
}
</script>
</body>
</html>
